name: Alerta ntfy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node ola.js

      - name: Enviar notificación a ntfy
        run: |
          curl -H "Title: Push a main" \
               -d "Nuevo push en ${{ github.repository }} por ${{ github.actor }}: ${{ github.event.head_commit.message }}" \
               https://ntfy.sh/devops-itla
